name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # `--all-features` is deliberately NOT used anywhere below (Unix jobs used
  # to use it, replaced by this explicit list): it would also enable
  # llama-cpp-cuda/-metal/-vulkan/-rocm/-opencl/-mkl (Cargo.toml), each of
  # which requires its own GPU SDK/toolkit at build time that isn't
  # installed on standard GitHub-hosted runners - `cargo` builds every
  # feature it's given regardless of hardware availability, so this fails
  # every job that uses it (confirmed: cmake configure error "CUDA Toolkit
  # not found" on ubuntu-latest). This list is every feature that only
  # needs a C/C++ toolchain, already present on GitHub's ubuntu/macos
  # runners (llama-cpp compiles vendored llama.cpp via cmake; see
  # llama-cpp-2-integration-plan.md §3/§4.2). Windows keeps its own
  # narrower openai,aws-bedrock list below - but that list still exercises
  # `gguf-management` (local .gguf list/pull/rm, no FFI/cmake) because it's
  # part of `default`, which every command below includes automatically
  # (none pass `--no-default-features`). That's the point of
  # ccguf-managment-imrpoment-plan.md Phase M0: Windows CI could never
  # exercise the model-management commands before this split (they lived
  # behind `llama-cpp`, which Windows CI has never enabled, since it has no
  # `cmake` install step for it), and now it does, with no toolchain cost.
  CI_FEATURES: openai,aws-bedrock,ollama,llama-cpp,llama-cpp-llguidance,profiling

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install CMake (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake -y

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-target-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --features openai,aws-bedrock --verbose

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --features ${{ env.CI_FEATURES }} --verbose

      - name: Run doc tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --doc --features openai,aws-bedrock

      - name: Run doc tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --doc --features ${{ env.CI_FEATURES }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --lib --bins --tests --features ${{ env.CI_FEATURES }} -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install CMake (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake -y

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --features openai,aws-bedrock

      - name: Build (Unix)
        if: matrix.os != 'windows-latest'
        run: cargo build --release --features ${{ env.CI_FEATURES }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: crustly-${{ matrix.os }}
          path: |
            target/release/crustly${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --out Xml --features ${{ env.CI_FEATURES }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          fail_ci_if_error: true
          verbose: true
