[package]
name = "crustly"
version = "0.5.2"
edition = "2021"
rust-version = "1.75"
authors = ["Crustly Team"]
license = "FSL-1.1-MIT"
description = "High-performance terminal AI assistant for software development"
repository = "https://github.com/jyjeanne/crustly"
keywords = ["ai", "terminal", "assistant", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"
pin-project = "1.1"

# CLI Framework
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
clap_complete = "4.5"

# TUI
ratatui = { version = "0.30", features = ["all-widgets"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-textarea = "0.9"
tui-tree-widget = "0.24"
ratatui-image = { version = "11.0", default-features = false, features = ["image-defaults", "crossterm"] }
viuer = "0.11"
arboard = "3.4"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "uuid"] }
# Note: Using only sqlx to avoid libsqlite3-sys version conflict
# Note: Using native-tls on Windows to avoid aws-lc-rs CMake/NASM requirement
# refinery = { version = "0.8", features = ["sqlx"] }  # TODO: Add migrations later

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "1.1"

# Configuration
config = "0.15"
dirs = "6.0"
shellexpand = "3.1"

# HTTP & LLM Clients
reqwest = { version = "0.13", features = ["json", "native-tls", "stream", "query"], default-features = false }
async-openai = { version = "0.41", optional = true }
aws-sdk-bedrockruntime = { version = "1.15", optional = true }
# Native Ollama provider. Pulls its own reqwest 0.12 client internally (ollama-rs
# is built against reqwest 0.12, incompatible with the reqwest 0.11 client used
# by the rest of this crate) - the two major versions coexist in the dependency
# tree, they are not shared/reused across providers.
ollama-rs = { version = "0.3", optional = true, features = ["stream"] }
# Needed to build ollama-rs's `ToolInfo`/`FormatType` schemas from our generic
# serde_json::Value tool definitions. Version must track ollama-rs's own
# schemars dependency (currently 1.2.x).
schemars = { version = "1.2", optional = true, features = ["preserve_order"] }
# In-process llama.cpp inference (loads a local .gguf file directly, no
# external server). Builds the vendored llama.cpp C++ sources via `cmake` at
# `cargo build` time - requires a C/C++ toolchain, only when this feature is
# enabled. See llama-cpp-2-integration-plan.md.
llama-cpp-2 = { version = "0.1.153", optional = true, default-features = false }
# Checksum verification for downloaded .gguf files (llama_cpp_models.rs) -
# see llama-cpp-2-integration-plan.md §4.11/§8 and, for why this is gated on
# `gguf-management` rather than `llama-cpp`, ccguf-managment-imrpoment-plan.md
# Phase M0.
sha2 = { version = "0.11", optional = true }
# Cross-platform free-disk-space query for the download precheck
# (llama_cpp_models.rs, Phase M6) - no stable stdlib API exists for this.
# Only the `Disks`/`Disk` API is used (`Disks::new_with_refreshed_list()`,
# `.mount_point()`, `.available_space()`), so default features are dropped
# to skip process/network/component enumeration this crate doesn't need.
sysinfo = { version = "0.33", optional = true, default-features = false, features = [
    "disk",
] }
# Grammar-constrained decoding for tool calls (Phase 4b, `llama-cpp-llguidance`
# feature only) - builds the JSON-Schema-union grammar and the constrained
# sampler in src/llm/provider/llama_cpp_grammar.rs. Neither is re-exported
# by `llama-cpp-2` (its `LlamaSampler::llguidance_tok_env` merely returns a
# `toktrie::TokEnv` by name), so both must be declared directly here (same
# version constraint `llama-cpp-2` 0.1.153 itself pins, "1.7").
llguidance = { version = "1.7", optional = true }
toktrie = { version = "1.7", optional = true }

# Provider Registry (Crabrace - replaces Catwalk)
crabrace = "0.1.0"

# Error Handling
anyhow = "1.0"
thiserror = "2.0"
color-eyre = "0.6"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
glob = "0.3"
ignore = "0.4"
which = "8.0"
shell-words = "1.1"
notify = { version = "8.2", features = ["serde"] }
git2 = "0.21"
rand = "0.9"
urlencoding = "2.1"

# Syntax & Parsing
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
tree-sitter = "0.26"
pulldown-cmark = "0.13"

# LSP
tower-lsp = "0.20"
lsp-types = "0.97"

# Tokenization (BPE-based, accurate to <2% for cl100k_base vocab)
tiktoken-rs = "0.12"

# Concurrent Data Structures
dashmap = "6.2"
parking_lot = "0.12"
once_cell = "1.19"
arc-swap = "1.6"

# Security
zeroize = { version = "1.7", features = ["derive"] }
keyring = "4.1"

# Misc
bytes = "1.5"
mime = "0.3"
base64 = "0.23"

# Document Parsing
pdf-extract = "0.12"
zip = "8.6"
quick-xml = "0.41"

[dev-dependencies]
rstest = "0.26"
proptest = "1.4"
mockall = "0.15"
criterion = { version = "0.8", features = ["html_reports"] }
insta = { version = "1.34", features = ["json", "yaml"] }
tempfile = "3.9"
tokio-test = "0.4"

# Platform-specific dependencies
[target.'cfg(unix)'.dependencies]
# Profiling (Unix-only - not supported on Windows)
pprof = { version = "0.15", features = ["flamegraph", "frame-pointer"], optional = true }

[features]
default = ["gguf-management"]
# Profiling feature enables pprof on Unix only (no-op on Windows)
profiling = []
openai = ["async-openai"]
aws-bedrock = ["aws-sdk-bedrockruntime"]
ollama = ["dep:ollama-rs", "dep:schemars"]
# Local `.gguf` file management (list/pull/rm - directory scan + plain HTTP,
# no FFI) - see ccguf-managment-imrpoment-plan.md Phase M0. Unlike
# `llama-cpp` below, this carries no C/C++ toolchain cost (only `sha2`, a
# small pure-Rust dependency), so it's part of `default` and `all-llm`:
# managing `.gguf` files shouldn't require building the in-process inference
# engine just to list what's on disk.
gguf-management = ["dep:sha2", "dep:sysinfo"]
# Deliberately NOT part of `all-llm`/`default`: unlike every other provider
# feature (and unlike `gguf-management` above), this one compiles native
# C++ (cmake + a C/C++ toolchain required) - see
# llama-cpp-2-integration-plan.md §3/§3.4/§4.2. Depends on `gguf-management`
# so `--features llama-cpp` still gets `crustly llama-cpp list/pull/rm`
# exactly as before this feature was split out.
llama-cpp = ["dep:llama-cpp-2", "gguf-management"]
# GPU backends (llama-cpp-2-integration-plan.md §4.1/Phase 8), each layered
# on top of `llama-cpp` and requiring its own SDK/toolkit at build time -
# see §4.2. Opt-in individually; none are implied by `llama-cpp` alone
# (CPU-only) or by `all-llm` (§3.4).
llama-cpp-cuda = ["llama-cpp", "llama-cpp-2/cuda"]
llama-cpp-metal = ["llama-cpp", "llama-cpp-2/metal"]
llama-cpp-vulkan = ["llama-cpp", "llama-cpp-2/vulkan"]
llama-cpp-rocm = ["llama-cpp", "llama-cpp-2/rocm"]
llama-cpp-opencl = ["llama-cpp", "llama-cpp-2/opencl"]
llama-cpp-mkl = ["llama-cpp", "llama-cpp-2/mkl"]
# Grammar-constrained tool-call decoding (llama-cpp-2-integration-plan.md
# Phase 4b) - additive on top of the always-on JSON-recovery heuristic
# (§4.7), not a replacement for it. Not wired into the default generation
# path yet - see src/llm/provider/llama_cpp_grammar.rs's module doc.
llama-cpp-llguidance = ["llama-cpp", "llama-cpp-2/llguidance", "dep:llguidance", "dep:toktrie"]
all-llm = ["openai", "aws-bedrock", "ollama", "gguf-management"]

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = "z"
strip = true

[[bin]]
name = "crustly"
path = "src/main.rs"

# Benchmarks
[[bench]]
name = "database"
harness = false
path = "benches/database.rs"

[[bench]]
name = "parallel_tool_dispatch"
harness = false
path = "benches/parallel_tool_dispatch.rs"

# [[bench]]
# name = "llm_processing"
# harness = false
# path = "benches/llm_processing.rs"
